name: Build RX Recorder AAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build RX Recorder
        run: gradle --no-daemon :plugin:assembleDebug :plugin:assembleRelease

      - name: Upload AAR files
        uses: actions/upload-artifact@v4
        with:
          name: RXRecorder-AAR
          path: plugin/build/outputs/aar/*.aar
          if-no-files-found: error
